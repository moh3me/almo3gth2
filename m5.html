<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي | المعجزه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   
    <style>
        :root {
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .contact-container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 30px;
            text-align: center; box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            width: 90%; max-width: 450px;
            transition: transform 0.3s ease;
            position: relative; z-index: 10;
        }

        .logo-area h1 {
            color: var(--text-color); font-size: 2.5rem;
            margin-bottom: 10px; letter-spacing: 2px;
            text-shadow: 0 0 15px var(--primary-color);
        }

        .links-wrapper { display: flex; flex-direction: column; gap: 15px; }

        .contact-link {
            display: flex; align-items: center;
            padding: 15px 25px; border-radius: 15px;
            text-decoration: none; color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease; cursor: pointer;
        }

        .contact-link i { font-size: 1.5rem; margin-left: 15px; width: 30px; }
        .contact-link span { font-weight: bold; font-size: 1.1rem; }

        .facebook:hover { background: #1877F2; box-shadow: 0 0 20px #1877F2; }
        .instagram:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); box-shadow: 0 0 20px #dc2743; }
        .email:hover { background: #ea4335; box-shadow: 0 0 20px #ea4335; }

        .contact-link:hover { transform: scale(1.05); border-color: transparent; }

        /* نافذة النسخ الذكية (Popup) */
        #copyPopup {
            display: none;
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e; border: 1px solid var(--primary-color);
            padding: 25px; border-radius: 20px; z-index: 100;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            width: 300px; text-align: center;
        }

        .btn-copy {
            margin-top: 15px; padding: 10px 20px;
            background: var(--primary-color); border: none;
            border-radius: 10px; cursor: pointer; font-weight: bold;
        }

        .overlay-bg {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90;
        }

        .circles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .circle { position: absolute; background: var(--primary-color); border-radius: 50%; opacity: 0.2; filter: blur(50px); }
    </style>
</head>
<body>

    <div class="circles">
        <div class="circle" style="width: 300px; height: 300px; top: -100px; right: -50px;"></div>
        <div class="circle" style="width: 200px; height: 200px; bottom: -50px; left: -50px; background: #ff0080;"></div>
    </div>

    <div class="contact-container">
        <div class="logo-area">
            <h1>المعجزه</h1>
            <p>نصنع حلولاً رقمية تليق بطموحاتك</p>
        </div>

        <div class="links-wrapper">
            <a href="https://www.facebook.com/share/19U8tJ5afr" target="_blank" class="contact-link facebook">
                <i class="fab fa-facebook-f"></i>
                <span>تابعنا على فيسبوك</span>
            </a>

            <a href="https://www.instagram.com/moh3md2005?psln=dXBqaGdnN21wbGl4" target="_blank" class="contact-link instagram">
                <i class="fab fa-instagram"></i>
                <span>شاهد أعمالنا على إنستغرام</span>
            </a>

            <div onclick="https://mail.google.com/mail/?view=cm&fs=1&to=tltm8315@gmail.com" class="contact-link email">
                <i class="far fa-envelope"></i>
                <span>راسلنا عبر البريد</span>
            </div>
        </div>

        <p style="margin-top: 30px; font-size: 0.8rem; color: #888;">&copy; 2026 M3M Agency - جميع الحقوق محفوظة</p>
    </div>

    <div class="overlay-bg" id="overlay" onclick="closePopup()"></div>
    <div id="copyPopup">
        <h4 style="margin: 0 0 10px;">جاري فتح البريد...</h4>
        <p style="font-size: 0.8rem; color: #ccc;">إذا لم يفتح التطبيق، يمكنك نسخ البريد يدوياً:</p>
        <div style="background: #000; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin: 10px 0;">
            <span id="emailText">tltm8315@gmail.com</span>
        </div>
        <button class="btn-copy" onclick="copyAction()">نسخ البريد</button>
        <button onclick="closePopup()" style="background:none; border:none; color:#555; display:block; margin: 10px auto; cursor:pointer;">إغلاق</button>
    </div>

    <script>
        function handleEmail() {
            // محاولة فتح البريد تلقائياً
            window.location.href = "mailto:Wepsitem3m@gmail.com";
           
            // إظهار نافذة النسخ كبديل للكمبيوتر
            document.getElementById('copyPopup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function copyAction() {
            var email = document.getElementById("emailText").innerText;
            navigator.clipboard.writeText(email);
            alert("تم نسخ البريد بنجاح!");
            closePopup();
        }

        function closePopup() {
            document.getElementById('copyPopup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>

</body>
</html>
